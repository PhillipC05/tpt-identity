# TPT Identity — nginx reverse proxy with TLS termination.
# Replace identity.example.com and certificate paths before use.

server {
    listen 80;
    server_name identity.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name identity.example.com;

    ssl_certificate     /etc/ssl/certs/identity.example.com.crt;
    ssl_certificate_key /etc/ssl/private/identity.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # JWKS is cached by verifiers — allow aggressive caching.
    location = /.well-known/jwks.json {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         Cache-Control "public, max-age=3600, stale-while-revalidate=86400";
    }

    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
